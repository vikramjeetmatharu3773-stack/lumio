[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
composeBom = "2024.11.00"
coreKtx = "1.15.0"
splash = "1.0.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
navigation = "2.8.4"
media3 = "1.4.1"
room = "2.6.1"
datastore = "1.1.1"
coil = "2.7.0"
glance = "1.1.1"
